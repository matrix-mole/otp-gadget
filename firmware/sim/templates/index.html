<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>OTP Gadget — {{ instance_name }}</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #1a1a1a;
      color: #ccc;
      font-family: monospace;
      font-size: 13px;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      gap: 20px;
      padding: 20px;
      min-height: 100vh;
    }

    .panel {
      background: #2a2a2a;
      border: 1px solid #444;
      border-radius: 6px;
      padding: 14px;
      width: 200px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .panel h3 {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #888;
      border-bottom: 1px solid #444;
      padding-bottom: 6px;
    }

    .field label {
      display: block;
      margin-bottom: 6px;
      color: #aaa;
    }

    .field input[type="text"],
    .field textarea {
      width: 100%;
      background: #1a1a1a;
      border: 1px solid #555;
      color: #eee;
      padding: 5px 7px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 12px;
    }

    .field textarea { resize: vertical; height: 70px; }
    .field input[type="range"] { width: 100%; }

    button {
      background: #3a3a3a;
      border: 1px solid #555;
      color: #ddd;
      padding: 5px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-family: monospace;
      font-size: 12px;
      width: 100%;
    }
    button:hover { background: #4a4a4a; }
    button.active { background: #2a5a2a; border-color: #4a8a4a; color: #8f8; }
    button.primary { background: #2a4a2a; border-color: #3a7a3a; color: #8f8; }
    button.primary:hover { background: #3a5a3a; }

    /* Slot occupied state */
    .slot-occupied {
      display: none;
      align-items: center;
      gap: 6px;
    }
    .slot-card-name {
      flex: 1;
      color: #8f8;
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .slot-eject-btn {
      width: auto;
      flex-shrink: 0;
      padding: 4px 9px;
      font-size: 11px;
    }

    /* Screen */
    canvas {
      display: block;
      background: #000;
      border: 2px solid #555;
      border-radius: 4px;
      cursor: crosshair;
      image-rendering: pixelated;
    }
    canvas.powered-off { cursor: default; }

    .screen-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    /* Power bar */
    .power-bar {
      width: 100%;
      background: #2a2a2a;
      border: 1px solid #444;
      border-radius: 6px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .power-label { font-size: 12px; color: #888; }
    .power-label.on { color: #4a4; }
    .power-btn {
      width: auto;
      padding: 5px 16px;
      font-size: 12px;
      flex-shrink: 0;
    }
    .power-btn.turn-on { background: #2a4a2a; border-color: #4a8a4a; color: #8f8; }
    .power-btn.turn-on:hover { background: #3a5a3a; }
    .power-btn.turn-off { background: #3a1a1a; border-color: #7a3a3a; color: #f88; }
    .power-btn.turn-off:hover { background: #4a2a2a; }

    .ws-status { font-size: 11px; color: #888; }
    .ws-status.connected { color: #4a4; }

    .back-link {
      font-size: 11px;
      color: #666;
      text-decoration: none;
      display: block;
      margin-bottom: 6px;
    }
    .back-link:hover { color: #aaa; }

    /* Card picker modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .modal-box {
      background: #2a2a2a;
      border: 1px solid #555;
      border-radius: 8px;
      width: 300px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
    }
    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      border-bottom: 1px solid #444;
      flex-shrink: 0;
    }
    .modal-header span {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #888;
    }
    .modal-close {
      width: auto;
      padding: 3px 8px;
      font-size: 14px;
      line-height: 1;
    }
    .modal-body {
      padding: 12px 14px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .new-card-form {
      display: none;
      flex-direction: column;
      gap: 6px;
      padding: 8px;
      background: #1e1e1e;
      border-radius: 4px;
    }
    .new-card-form input {
      background: #1a1a1a;
      border: 1px solid #555;
      color: #eee;
      padding: 5px 7px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 12px;
      width: 100%;
    }
    .new-card-form .btn-row {
      display: flex;
      gap: 6px;
    }
    .new-card-form .btn-row button { flex: 1; }
    .error-msg {
      color: #d44;
      font-size: 11px;
      display: none;
    }
    .card-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .card-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      background: #333;
      border-radius: 4px;
      cursor: pointer;
      border: 1px solid transparent;
      user-select: none;
    }
    .card-row:hover:not(.unavailable) {
      background: #3a4a3a;
      border-color: #4a8a4a;
    }
    .card-row.unavailable { opacity: 0.45; cursor: not-allowed; }
    .card-row-name { flex: 1; color: #ddd; font-size: 13px; }
    .card-row-hint { font-size: 10px; color: #888; white-space: nowrap; }
    .card-trash {
      width: auto;
      padding: 3px 7px;
      font-size: 12px;
      flex-shrink: 0;
    }
    .card-trash:disabled { opacity: 0.35; cursor: not-allowed; }
    .card-empty { color: #666; font-size: 12px; text-align: center; padding: 16px 0; }

    /* Breadcrumb */
    .breadcrumb-wrap {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .breadcrumb-bar {
      flex: 1;
      min-width: 0;
      background: #1e1e1e;
      border: 1px solid #383838;
      border-radius: 4px;
      padding: 4px 10px;
      font-size: 11px;
      min-height: 26px;
      display: flex;
      align-items: center;
    }
    .breadcrumb-path { flex: 1; min-width: 0; }
    .breadcrumb-item { color: #ccc; }
    .breadcrumb-item.current { color: #8f8; }
    .breadcrumb-sep { color: #ccc; margin: 0 1px; }
    .breadcrumb-empty { color: #444; }
    .breadcrumb-copy {
      flex-shrink: 0;
      background: none;
      border: 1px solid #383838;
      color: #666;
      border-radius: 3px;
      cursor: pointer;
      width: 26px;
      height: 26px;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .breadcrumb-copy:hover { border-color: #666; color: #aaa; background: none; }
    .breadcrumb-copy.copied { color: #8f8; border-color: #4a8a4a; }
  </style>
</head>
<body>

<!-- Left: Hardware panel -->
<div class="panel">
  <a href="/" class="back-link">&larr; Hub</a>
  <h3>{{ instance_name }}</h3>

  <div class="field">
    <label>Own SD card</label>
    <button id="btn-choose-own" onclick="openPicker('own')">Choose card</button>
    <div id="slot-occupied-own" class="slot-occupied">
      <span class="slot-card-name" id="slot-card-name-own"></span>
      <button class="slot-eject-btn" onclick="ejectSlot('own')">Eject</button>
    </div>
  </div>

  <div class="field">
    <label>Guest SD card</label>
    <button id="btn-choose-guest" onclick="openPicker('guest')">Choose card</button>
    <div id="slot-occupied-guest" class="slot-occupied">
      <span class="slot-card-name" id="slot-card-name-guest"></span>
      <button class="slot-eject-btn" onclick="ejectSlot('guest')">Eject</button>
    </div>
  </div>

  <div class="field">
    <label>Battery <span id="bat-pct">80</span>%</label>
    <input type="range" id="bat-slider" min="0" max="100" value="80">
  </div>

  <div class="field">
    <label>Charger</label>
    <button id="btn-charger">Plugged in</button>
  </div>
  <div class="field">
    <label>Debug</label>
    <button id="btn-trigger-error">Trigger error</button>
  </div>
</div>

<!-- Center: Screen -->
<div class="screen-wrap">
  <div class="power-bar" id="power-bar">
    <span class="power-label" id="power-label">Device is powered off</span>
    <button class="power-btn turn-on" id="btn-power">Power on</button>
  </div>
  <canvas id="screen" width="{{ width }}" height="{{ height }}"></canvas>
  <div class="breadcrumb-wrap" style="width: {{ width }}px">
    <div class="breadcrumb-bar" id="breadcrumb-bar">
      <span class="breadcrumb-path" id="breadcrumb-path"><span class="breadcrumb-empty">—</span></span>
    </div>
    <button class="breadcrumb-copy" id="breadcrumb-copy" onclick="copyBreadcrumb()" title="Copy path">
      <svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" fill="currentColor" viewBox="0 0 256 256"><path d="M216,32H88a8,8,0,0,0-8,8V80H40a8,8,0,0,0-8,8V216a8,8,0,0,0,8,8H168a8,8,0,0,0,8-8V176h40a8,8,0,0,0,8-8V40A8,8,0,0,0,216,32ZM160,208H48V96H160Zm48-48H176V88a8,8,0,0,0-8-8H96V48H208Z"></path></svg>
    </button>
  </div>
  <div class="ws-status" id="ws-status">Connecting…</div>
</div>

<!-- Right: QR panel -->
<div class="panel">
  <h3>QR Scanner</h3>
  <div class="field">
    <label>Inject QR value (hex)</label>
    <textarea id="qr-input" placeholder="Paste hex string here…"></textarea>
    <button id="btn-qr-submit" style="margin-top:4px">Submit</button>
  </div>
</div>

<!-- Card picker modal -->
<div id="card-modal" class="modal-overlay">
  <div class="modal-box">
    <div class="modal-header">
      <span>SD Cards</span>
      <button class="modal-close" onclick="closePicker()">&#x2715;</button>
    </div>
    <div class="modal-body">
      <button class="primary" id="btn-new-card" onclick="showNewCardForm()">+ New card</button>
      <div id="new-card-form" class="new-card-form">
        <input type="text" id="new-card-name" placeholder="Card name…">
        <div class="btn-row">
          <button onclick="createCard()">Create</button>
          <button onclick="hideNewCardForm()">Cancel</button>
        </div>
        <div class="error-msg" id="new-card-error"></div>
      </div>
      <div id="card-list" class="card-list"></div>
    </div>
  </div>
</div>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script>
  const DEVICE_ID = "{{ device_id }}";
  const socket = io({ path: "/sim/socket.io", query: { device_id: DEVICE_ID } });
  const canvas = document.getElementById("screen");
  const ctx = canvas.getContext("2d");
  const wsStatus = document.getElementById("ws-status");

  let powered = {{ 'true' if powered else 'false' }};

  // --- Breadcrumb ------------------------------------------------------------

  const breadcrumb = [];

  socket.on("screen_nav", (msg) => {
    const idx = breadcrumb.indexOf(msg.name);
    if (idx !== -1) {
      breadcrumb.splice(idx + 1);  // going back: truncate to this screen
    } else {
      breadcrumb.push(msg.name);   // going forward: extend the trail
    }
    renderBreadcrumb();
  });

  function renderBreadcrumb() {
    const path = document.getElementById("breadcrumb-path");
    if (breadcrumb.length === 0) {
      path.innerHTML = '<span class="breadcrumb-empty">—</span>';
      return;
    }
    const html = breadcrumb.map((name, i) => {
      const cls = i === breadcrumb.length - 1 ? "breadcrumb-item current" : "breadcrumb-item";
      const sep = i > 0 ? '<span class="breadcrumb-sep">/</span><wbr>' : '';
      return `${sep}<span class="${cls}">${name}</span>`;
    }).join('');
    path.innerHTML = html;
  }

  let _copyTimer = null;
  function copyBreadcrumb() {
    if (!breadcrumb.length) return;
    navigator.clipboard.writeText(breadcrumb.join("/"));
    const btn = document.getElementById("breadcrumb-copy");
    btn.classList.add("copied");
    clearTimeout(_copyTimer);
    _copyTimer = setTimeout(() => { btn.classList.remove("copied"); }, 1500);
  }

  // --- WebSocket / display ---------------------------------------------------

  socket.on("connect", () => {
    wsStatus.textContent = "Connected";
    wsStatus.className = "ws-status connected";
  });
  socket.on("disconnect", () => {
    wsStatus.textContent = "Disconnected";
    wsStatus.className = "ws-status";
  });

  function rgb565ToRgb(c) {
    return [((c >> 11) & 0x1F) * 255 / 31, ((c >> 5) & 0x3F) * 255 / 63, (c & 0x1F) * 255 / 31].map(Math.round);
  }

  socket.on("draw", (msg) => {
    if (!powered) return;
    if (msg.op === "fill") {
      const [r, g, b] = rgb565ToRgb(msg.color);
      ctx.fillStyle = `rgb(${r},${g},${b})`;
      ctx.fillRect(msg.x, msg.y, msg.w, msg.h);
    } else if (msg.op === "blit") {
      const raw = atob(msg.data);
      const bytes = new Uint8Array(raw.length);
      for (let i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
      const imgData = ctx.createImageData(msg.w, msg.h);
      for (let i = 0; i < msg.w * msg.h; i++) {
        const c = (bytes[i * 2] << 8) | bytes[i * 2 + 1];
        const [r, g, b] = rgb565ToRgb(c);
        imgData.data[i * 4] = r; imgData.data[i * 4 + 1] = g;
        imgData.data[i * 4 + 2] = b; imgData.data[i * 4 + 3] = 255;
      }
      ctx.putImageData(imgData, msg.x, msg.y);
    }
  });

  canvas.addEventListener("pointerdown", (e) => {
    if (!powered) return;
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const x = Math.floor((e.clientX - rect.left) * scaleX);
    const y = Math.floor((e.clientY - rect.top) * scaleY);
    socket.emit("touch", { device_id: DEVICE_ID, x, y });
  });

  // --- Power bar -------------------------------------------------------------

  const btnPower = document.getElementById("btn-power");
  const powerLabel = document.getElementById("power-label");

  function applyPoweredState(on) {
    powered = on;
    if (on) {
      powerLabel.textContent = "Device is powered on";
      powerLabel.className = "power-label on";
      btnPower.textContent = "Power off";
      btnPower.className = "power-btn turn-off";
      canvas.classList.remove("powered-off");
    } else {
      powerLabel.textContent = "Device is powered off";
      powerLabel.className = "power-label";
      btnPower.textContent = "Power on";
      btnPower.className = "power-btn turn-on";
      canvas.classList.add("powered-off");
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      breadcrumb.length = 0;
      renderBreadcrumb();
      document.getElementById("breadcrumb-copy").classList.remove("copied");
    }
  }

  btnPower.addEventListener("click", () => {
    socket.emit("hw_action", { device_id: DEVICE_ID, action: powered ? "power_off" : "power_on" });
  });

  // --- hw_response dispatcher ------------------------------------------------

  socket.on("hw_response", (msg) => {
    if (msg.action === "powered_on") {
      applyPoweredState(true);
      if (msg.slots) {
        applySlotState("own", msg.slots.own);
        applySlotState("guest", msg.slots.guest);
      }
    } else if (msg.action === "powered_off") {
      applyPoweredState(false);
    } else if (msg.action === "slot_chosen") {
      applySlotState(msg.slot, { card_id: msg.card_id, card_name: msg.card_name });
    } else if (msg.action === "slot_ejected") {
      applySlotState(msg.slot, null);
    } else if (msg.action === "slot_error") {
      alert(msg.error || "Slot error");
    }
  });

  applyPoweredState(powered);

  // --- Slot UI ---------------------------------------------------------------

  function applySlotState(slot, cardInfo) {
    const chooseBtn = document.getElementById(`btn-choose-${slot}`);
    const occupied = document.getElementById(`slot-occupied-${slot}`);
    const nameEl = document.getElementById(`slot-card-name-${slot}`);
    if (cardInfo) {
      chooseBtn.style.display = "none";
      occupied.style.display = "flex";
      nameEl.textContent = cardInfo.card_name;
      occupied.dataset.cardId = cardInfo.card_id;
    } else {
      chooseBtn.style.display = "block";
      occupied.style.display = "none";
      delete occupied.dataset.cardId;
    }
  }

  function ejectSlot(slot) {
    socket.emit("hw_action", { device_id: DEVICE_ID, action: "slot_eject", slot });
  }

  // Apply initial slot state from server
  applySlotState("own", {{ own_card | tojson }});
  applySlotState("guest", {{ guest_card | tojson }});

  // --- Card picker modal -----------------------------------------------------

  let pickerSlot = null;

  function openPicker(slot) {
    pickerSlot = slot;
    hideNewCardForm();
    refreshPicker();
    document.getElementById("card-modal").style.display = "flex";
  }

  function closePicker() {
    document.getElementById("card-modal").style.display = "none";
    pickerSlot = null;
  }

  document.getElementById("card-modal").addEventListener("click", (e) => {
    if (e.target === e.currentTarget) closePicker();
  });

  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") closePicker();
  });

  async function refreshPicker() {
    const cards = await fetch("/api/cards").then(r => r.json());
    const list = document.getElementById("card-list");
    list.innerHTML = "";

    const otherSlot = pickerSlot === "own" ? "guest" : "own";
    const otherOccupied = document.getElementById(`slot-occupied-${otherSlot}`);
    const otherCardId = otherOccupied.style.display !== "none" ? otherOccupied.dataset.cardId : null;

    if (cards.length === 0) {
      list.innerHTML = '<div class="card-empty">No SD cards yet. Create one above.</div>';
      return;
    }

    for (const card of cards) {
      const inOtherSlot = card.id === otherCardId;
      const unavailable = card.locked || inOtherSlot;

      const row = document.createElement("div");
      row.className = "card-row" + (unavailable ? " unavailable" : "");

      const hint = card.locked ? "in use elsewhere" : inOtherSlot ? "other slot" : "";
      const trashDisabled = unavailable ? "disabled" : "";

      row.innerHTML =
        `<span class="card-row-name">${escapeHtml(card.name)}</span>` +
        (hint ? `<span class="card-row-hint">${hint}</span>` : "") +
        `<button class="card-trash" ${trashDisabled} title="Delete"
          onclick="deleteCard(event,'${card.id}','${escapeHtml(card.name).replace(/'/g, "&#39;")}')">&#x1F5D1;</button>`;

      if (!unavailable) {
        row.addEventListener("click", (e) => {
          if (e.target.classList.contains("card-trash")) return;
          pickCard(card.id, card.name);
        });
      }
      list.appendChild(row);
    }
  }

  function pickCard(cardId, cardName) {
    socket.emit("hw_action", { device_id: DEVICE_ID, action: "slot_choose", slot: pickerSlot, card_id: cardId });
    closePicker();
  }

  async function deleteCard(e, cardId, cardName) {
    e.stopPropagation();
    if (!confirm(`Delete "${cardName}"? This wipes the card permanently.`)) return;
    const r = await fetch(`/api/cards/${cardId}`, { method: "DELETE" });
    if (r.ok) {
      await refreshPicker();
    } else {
      const data = await r.json().catch(() => ({}));
      alert(data.error || "Cannot delete card.");
    }
  }

  function showNewCardForm() {
    const form = document.getElementById("new-card-form");
    form.style.display = "flex";
    document.getElementById("btn-new-card").style.display = "none";
    document.getElementById("new-card-name").focus();
  }

  function hideNewCardForm() {
    document.getElementById("new-card-form").style.display = "none";
    document.getElementById("btn-new-card").style.display = "block";
    document.getElementById("new-card-name").value = "";
    const errEl = document.getElementById("new-card-error");
    errEl.style.display = "none";
    errEl.textContent = "";
  }

  document.getElementById("new-card-name").addEventListener("keydown", (e) => {
    if (e.key === "Enter") createCard();
    if (e.key === "Escape") hideNewCardForm();
  });

  async function createCard() {
    const name = document.getElementById("new-card-name").value.trim();
    const errEl = document.getElementById("new-card-error");
    errEl.style.display = "none";
    if (!name) {
      errEl.textContent = "Name is required.";
      errEl.style.display = "block";
      return;
    }
    const r = await fetch("/api/cards", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name }),
    });
    if (r.ok) {
      hideNewCardForm();
      await refreshPicker();
    } else {
      const data = await r.json().catch(() => ({}));
      errEl.textContent = data.error || "Failed to create card.";
      errEl.style.display = "block";
    }
  }

  function escapeHtml(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  // --- Battery slider --------------------------------------------------------

  const batSlider = document.getElementById("bat-slider");
  const batPct = document.getElementById("bat-pct");
  batSlider.addEventListener("input", () => {
    batPct.textContent = batSlider.value;
    socket.emit("hw_action", { device_id: DEVICE_ID, action: "battery", value: parseInt(batSlider.value) });
  });

  // --- Charger toggle --------------------------------------------------------

  let charging = true;
  const btnCharger = document.getElementById("btn-charger");
  btnCharger.addEventListener("click", () => {
    charging = !charging;
    btnCharger.textContent = charging ? "Plugged in" : "Unplugged";
    btnCharger.className = charging ? "active" : "";
    socket.emit("hw_action", { device_id: DEVICE_ID, action: "charger", value: charging });
  });
  btnCharger.className = "active";

  // --- Trigger error (sim debug) ---------------------------------------------

  document.getElementById("btn-trigger-error").addEventListener("click", () => {
    socket.emit("hw_action", { device_id: DEVICE_ID, action: "trigger_error" });
  });

  // --- QR submit -------------------------------------------------------------

  document.getElementById("btn-qr-submit").addEventListener("click", () => {
    const value = document.getElementById("qr-input").value.trim();
    socket.emit("qr_submit", { device_id: DEVICE_ID, value });
    document.getElementById("qr-input").value = "";
  });
</script>
</body>
</html>
