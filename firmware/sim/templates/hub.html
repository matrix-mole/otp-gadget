<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>OTP Gadget Simulator — Hub</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #1a1a1a;
      color: #ccc;
      font-family: monospace;
      font-size: 13px;
      padding: 30px;
      min-height: 100vh;
    }

    h1 {
      font-size: 18px;
      color: #eee;
      margin-bottom: 28px;
      letter-spacing: 1px;
    }

    h2 {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #888;
      border-bottom: 1px solid #444;
      padding-bottom: 6px;
      margin-bottom: 14px;
    }

    section { margin-bottom: 32px; }

    /* Device type cards */
    .device-types {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .device-card {
      background: #2a2a2a;
      border: 1px solid #444;
      border-radius: 6px;
      padding: 14px 20px;
      cursor: pointer;
      min-width: 160px;
    }
    .device-card:hover { background: #333; }
    .device-card.selected {
      border-color: #4a8a4a;
      background: #1e2e1e;
    }
    .device-card .label { color: #ddd; font-size: 14px; margin-bottom: 4px; }
    .device-card .dims { color: #888; font-size: 11px; }

    /* Instance list */
    #instance-list { display: flex; flex-direction: column; gap: 8px; }

    .instance-row {
      background: #2a2a2a;
      border: 1px solid #444;
      border-radius: 6px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .inst-name { color: #eee; font-size: 14px; flex: 1; min-width: 100px; }
    .inst-type { color: #888; font-size: 11px; width: 120px; }

    .power-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #555;
      flex-shrink: 0;
      title: "Powered off";
    }
    .power-dot.on { background: #4a4; }

    .actions { display: flex; gap: 6px; }

    .rename-form {
      display: none;
      align-items: center;
      gap: 6px;
      width: 100%;
      margin-top: 8px;
    }

    .rename-form input {
      flex: 1;
      background: #1a1a1a;
      border: 1px solid #555;
      color: #eee;
      padding: 5px 7px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 12px;
    }

    .empty { color: #666; padding: 10px 0; }

    /* New instance form */
    .new-instance-form {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .new-instance-form input {
      background: #1a1a1a;
      border: 1px solid #555;
      color: #eee;
      padding: 6px 10px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 13px;
      width: 260px;
    }

    .error {
      color: #d44;
      margin-top: 8px;
      font-size: 12px;
    }

    button {
      background: #3a3a3a;
      border: 1px solid #555;
      color: #ddd;
      padding: 5px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-family: monospace;
      font-size: 12px;
    }
    button:hover { background: #4a4a4a; }
    button.primary { background: #2a4a2a; border-color: #3a7a3a; color: #8f8; }
    button.primary:hover { background: #3a5a3a; }
    button.danger { background: #3a1a1a; border-color: #7a3a3a; color: #f88; }
    button.danger:hover { background: #4a2a2a; }
  </style>
</head>
<body>

<h1>OTP Gadget Simulator</h1>

<!-- Device types -->
<section>
  <h2>Device Type</h2>
  <div class="device-types">
    {% for dt in device_types %}
    <div class="device-card{% if loop.first %} selected{% endif %}" data-type-id="{{ dt.id }}">
      <div class="label">{{ dt.label }}</div>
      <div class="dims">{{ dt.width }}&times;{{ dt.height }}</div>
    </div>
    {% endfor %}
  </div>
</section>

<!-- Instances -->
<section>
  <h2>Instances</h2>
  <div id="instance-list">
    {% for inst in instances %}
    <div class="instance-row" id="row-{{ inst.id }}">
      <span class="power-dot{% if power_map.get(inst.id) %} on{% endif %}" title="{% if power_map.get(inst.id) %}Powered on{% else %}Powered off{% endif %}"></span>
      <div class="inst-name" id="name-{{ inst.id }}">{{ inst.name }}</div>
      <div class="inst-type">{{ inst.device_type }}</div>
      <div class="actions">
        <button class="primary" onclick="connectDevice('{{ inst.id }}')">Connect</button>
        <button onclick="startRename('{{ inst.id }}', '{{ inst.name }}')">Rename</button>
        <button class="danger" onclick="deleteDevice('{{ inst.id }}')">Delete</button>
      </div>
      <div class="rename-form" id="rename-form-{{ inst.id }}">
        <input type="text" id="rename-input-{{ inst.id }}" value="{{ inst.name }}">
        <button onclick="doRename('{{ inst.id }}')">Save</button>
        <button onclick="cancelRename('{{ inst.id }}')">Cancel</button>
      </div>
    </div>
    {% endfor %}
    {% if not instances %}
    <div class="empty" id="empty-msg">No instances yet. Create one below.</div>
    {% endif %}
  </div>
</section>

<!-- New instance -->
<section>
  <h2>New Instance</h2>
  <div class="new-instance-form">
    <input type="text" id="new-name" placeholder="Name (e.g. Alice)">
    <button class="primary" onclick="createInstance()">Create</button>
  </div>
  <div class="error" id="create-error" style="display:none"></div>
</section>

<script>
  let selectedType = '{{ device_types[0].id if device_types else "3.5inch" }}';

  document.querySelectorAll('.device-card').forEach(card => {
    card.addEventListener('click', () => {
      document.querySelectorAll('.device-card').forEach(c => c.classList.remove('selected'));
      card.classList.add('selected');
      selectedType = card.dataset.typeId;
    });
  });

  function connectDevice(id) {
    window.open('/device/' + id, '_blank');
  }

  function startRename(id, currentName) {
    const form = document.getElementById('rename-form-' + id);
    form.style.display = 'flex';
    const input = document.getElementById('rename-input-' + id);
    input.value = currentName;
    input.focus();
  }

  function cancelRename(id) {
    document.getElementById('rename-form-' + id).style.display = 'none';
  }

  async function doRename(id) {
    const name = document.getElementById('rename-input-' + id).value.trim();
    if (!name) return;
    const r = await fetch('/api/instances/' + id, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name }),
    });
    if (r.ok) {
      document.getElementById('name-' + id).textContent = name;
      document.getElementById('rename-form-' + id).style.display = 'none';
    }
  }

  async function deleteDevice(id) {
    if (!confirm('Delete this instance? The state directory on disk is kept.')) return;
    const r = await fetch('/api/instances/' + id, { method: 'DELETE' });
    if (r.ok) {
      document.getElementById('row-' + id).remove();
      if (document.querySelectorAll('.instance-row').length === 0) {
        const list = document.getElementById('instance-list');
        list.innerHTML = '<div class="empty" id="empty-msg">No instances yet. Create one below.</div>';
      }
    }
  }

  function makeRow(inst) {
    const row = document.createElement('div');
    row.className = 'instance-row';
    row.id = 'row-' + inst.id;
    row.innerHTML = `
      <span class="power-dot" title="Powered off"></span>
      <div class="inst-name" id="name-${inst.id}">${inst.name}</div>
      <div class="inst-type">${inst.device_type}</div>
      <div class="actions">
        <button class="primary" onclick="connectDevice('${inst.id}')">Connect</button>
        <button onclick="startRename('${inst.id}', '${inst.name}')">Rename</button>
        <button class="danger" onclick="deleteDevice('${inst.id}')">Delete</button>
      </div>
      <div class="rename-form" id="rename-form-${inst.id}">
        <input type="text" id="rename-input-${inst.id}" value="${inst.name}">
        <button onclick="doRename('${inst.id}')">Save</button>
        <button onclick="cancelRename('${inst.id}')">Cancel</button>
      </div>
    `;
    return row;
  }

  async function createInstance() {
    const name = document.getElementById('new-name').value.trim();
    const errEl = document.getElementById('create-error');
    errEl.style.display = 'none';
    if (!name) {
      errEl.textContent = 'Name is required.';
      errEl.style.display = 'block';
      return;
    }
    const r = await fetch('/api/instances', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, device_type: selectedType }),
    });
    if (!r.ok) {
      const data = await r.json().catch(() => ({}));
      errEl.textContent = data.error || 'Failed to create instance.';
      errEl.style.display = 'block';
      return;
    }
    const inst = await r.json();
    document.getElementById('new-name').value = '';
    const list = document.getElementById('instance-list');
    const empty = document.getElementById('empty-msg');
    if (empty) empty.remove();
    list.appendChild(makeRow(inst));
    window.open('/device/' + inst.id, '_blank');
  }

  document.getElementById('new-name').addEventListener('keydown', e => {
    if (e.key === 'Enter') createInstance();
  });
</script>
</body>
</html>
